[versions]
slf4j = "1.7.30"
junit = "5.14.4"
# org.junit.platform artifacts (e.g. junit-platform-launcher) have their own major version:
# Platform 1.x.y is released together with Jupiter 5.x.y (same minor/patch).
junit-platform = "1.14.4"
jacoco = "0.8.15"
license-plugin = "0.16.1"
shadow-plugin = "9.6.1"
sonarqube-plugin = "7.4.0.8496"
artifactory-plugin = "6.0.4"

[libraries]
commons-io = { module = "commons-io:commons-io", version = "2.22.0" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version = "3.20.0" }
commons-text = { module = "org.apache.commons:commons-text", version = "1.15.0" }
commons-validator = { module = "commons-validator:commons-validator", version = "1.11.0" }
guava = { module = "com.google.guava:guava", version = "33.7.1-jre" }
gson = { module = "com.google.code.gson:gson", version = "2.14.0" }
jsr305 = { module = "com.google.code.findbugs:jsr305", version = "3.0.2" }
junit4 = { module = "junit:junit", version = "4.13.2" }
junit5 = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
jupiter-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
slf4j = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version = "1.2.13" }
assertj = { module = "org.assertj:assertj-core", version = "3.27.7" }
mockito = { module = "org.mockito:mockito-core", version = "5.23.0" }
junit-dataprovider = { module = "com.tngtech.java:junit-dataprovider", version = "1.13.1" }
artifactory-plugin = { module = "com.jfrog.artifactory:com.jfrog.artifactory.gradle.plugin", version.ref = "artifactory-plugin" }

[plugins]
license = { id = "com.github.hierynomus.license", version.ref = "license-plugin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow-plugin" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube-plugin" }
