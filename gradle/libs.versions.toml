[versions]
slf4j = "1.7.30"
junit = "5.10.3"

[libraries]
commons-io = { module = "commons-io:commons-io", version = "2.16.1" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version = "3.20.0" }
commons-text = { module = "org.apache.commons:commons-text", version = "1.12.0" }
commons-validator = { module = "commons-validator:commons-validator", version = "1.10.0" }
guava = { module = "com.google.guava:guava", version = "33.5.0-jre" }
gson = { module = "com.google.code.gson:gson", version = "2.11.0" }
jsr305 = { module = "com.google.code.findbugs:jsr305", version = "3.0.2" }
junit4 = { module = "junit:junit", version = "4.13.2" }
junit5 = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
jupiter-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.10.3" }
slf4j = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version = "1.2.13" }
assertj = { module = "org.assertj:assertj-core", version = "3.26.0" }
mockito = { module = "org.mockito:mockito-core", version = "5.12.0" }
junit-dataprovider = { module = "com.tngtech.java:junit-dataprovider", version = "1.13.1" }
